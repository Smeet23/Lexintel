[project]
name = "lexintel-ingestion"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pypdfium2>=5,<6",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["reportlab>=4,<5"]
parser = [
    "docling-slim[standard]==2.151.1",
    "python-docx==1.2.0",
    "pillow>=11,<13",
    "torch>=2.5",
    "torchvision>=0.21",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]
torchvision = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]
